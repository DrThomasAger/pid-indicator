name: Share weapons from your attacks.txt
description: Send in weapons your fights taught the plugin, so everyone gets them
labels: [attack-book]
body:
  - type: textarea
    id: lines
    attributes:
      label: Lines from your attacks.txt
      description: Copy the lines for the new weapons from attacks.txt in the plugin's folder inside .runelite.
      render: text
    validations:
      required: true
  - type: input
    id: weapons
    attributes:
      label: Which weapons these are
      placeholder: Voidwaker, Webweaver bow
